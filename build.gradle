buildscript {
    ext.compileSdk = 33
    ext.targetSdk = 30
    ext.minSdk = 18

    ext.gradle_plugin_version = '8.4.2'
    ext.kotlin_plugin_version = '1.6.21'
    ext.androidx_core_version = '1.6.0'
    ext.androidx_appcompat_version = '1.5.1'
    ext.androidx_supportv4_version = '1.0.0'
    ext.android_desugar_jdk = '1.1.5'
    ext.commons_compress_version = '1.26.2'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_plugin_version"
        //noinspection DifferentKotlinGradleVersion
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_plugin_version"
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
